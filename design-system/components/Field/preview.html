<!doctype html>
<html>
<head><meta charset="utf-8"><title>Field — preview</title></head>
<body>
<div id="root"></div>
<script>
  var U = window.UVGulf, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div',{className:'uvg-grid'},
    h('div',{className:'uvg-stack'}, h(U.Field,{label:'Full name',required:true,placeholder:'Your name'}), h(U.Field,{label:'Area of interest',as:'select',options:['Inspection','Non-destructive testing','Calibration','Training','Technical advisory']})),
    h('div',{className:'uvg-stack'}, h(U.Field,{label:'Work email',type:'email',required:true,defaultValue:'ahmed@company',error:'Enter a full email address, like name@company.com'}), h(U.Field,{label:'Number of participants',type:'number',hint:'For group training enquiries.'}))));
</script>
</body>
</html>
