<!doctype html>

<style>
  html, body { margin: 0; padding: 0; background: var(--surface); }
  .cover { position: relative; width: 960px; height: 300px; overflow: hidden; background: var(--surface); }
  svg { position: absolute; inset: 0; }
  .navy { fill: var(--logo-navy); }
  .sky { fill: var(--logo-sky); }
  .deep { fill: var(--navy-950); }
  .tint { fill: var(--sky-300); }
  .signal { fill: var(--signal); }
  .r-md { rx: var(--radius-md); }
  .ring { fill: none; stroke: var(--on-deep); stroke-width: 24px; stroke-dasharray: 199.7 30.7; }
  .gear { fill: var(--on-deep); }
  .name { position: absolute; left: 40px; bottom: 76px; margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 104px; line-height: .92; letter-spacing: -0.01em; color: var(--ink); max-width: 440px; }
